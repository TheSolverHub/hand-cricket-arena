services:
  - type: web
    name: hand-cricket-arena
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OWNER_GAME_ID
        sync: false
      - key: ADMIN_TEAM_IDS
        sync: false
      - key: ADMIN_PIN
        sync: false
